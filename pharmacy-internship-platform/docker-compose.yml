version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmintern_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmintern
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: pharmintern_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmintern -d pharmintern_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pharmintern_redis
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
