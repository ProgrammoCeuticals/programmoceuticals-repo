# ProgrammoCeuticals eCTD Platform — CI Pipeline
# spec §54
#
# Every pull request runs:
#   lint -> typecheck -> unit tests -> migration validation
#   -> build -> security/dependency scan

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.4"

jobs:
  # ── Setup ───────────────────────────────────────────────────────────────
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate
      - run: pnpm lint

  # ── Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate
      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit
      - name: Typecheck packages
        run: |
          cd packages/ectd-domain && npx tsc --noEmit
          cd ../ectd-standards && npx tsc --noEmit
          cd ../ectd-documents && npx tsc --noEmit
          cd ../ectd-lifecycle && npx tsc --noEmit
          cd ../ectd-validation && npx tsc --noEmit
          cd ../ectd-xml && npx tsc --noEmit
          cd ../ectd-publishing && npx tsc --noEmit
          cd ../ectd-storage && npx tsc --noEmit

  # ── Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate
      - name: Run unit tests
        run: npx jest --config jest.config.ts --no-coverage --forceExit --runInBand
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ── Migration validation ───────────────────────────────────────────────────
  migration-check:
    name: Prisma migration validation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate schema
        run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:validate

  # ── XML tests ─────────────────────────────────────────────────────────────
  xml-tests:
    name: XML golden fixture tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate
      - name: Run XML golden fixture tests
        run: npx jest --config jest.config.ts --testPathPattern=tests/xml --no-coverage --forceExit

  # ── Contract tests ────────────────────────────────────────────────────────
  contract-tests:
    name: OpenAPI contract tests
    runs-on: ubuntu-latest
    needs: build
    # Only run contract tests when the API is available (post-build)
    # In CI, start the API in the background against a test DB
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ectd_user
          POSTGRES_PASSWORD: ectd_dev_password
          POSTGRES_DB: ectd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://ectd_user:ectd_dev_password@localhost:5432/ectd_test" pnpm db:generate
      - run: DATABASE_URL="postgresql://ectd_user:ectd_dev_password@localhost:5432/ectd_test" pnpm db:migrate
      - name: Start API in background
        run: |
          DATABASE_URL="postgresql://ectd_user:ectd_dev_password@localhost:5432/ectd_test" \
          REDIS_URL="redis://localhost:6379" \
          JWT_SECRET="ci-test-secret" \
          JWT_REFRESH_SECRET="ci-test-refresh-secret" \
          STORAGE_ROOT="/tmp/ectd-ci-storage" \
          node apps/api/dist/main.js &
          sleep 5
        continue-on-error: true
      - name: Run contract tests
        run: |
          API_BASE_URL=http://localhost:3000 \
          CI_SKIP_CONTRACT=false \
          npx jest --config jest.config.ts --testPathPattern=tests/contract --no-coverage --forceExit
        continue-on-error: true # non-blocking until API is fully stable in CI

  # ── Security scan ─────────────────────────────────────────────────────────
  security:
    name: Security / dependency scan
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # ── Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests, migration-check, xml-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: DATABASE_URL="postgresql://x:x@localhost/x" pnpm db:generate
      - run: pnpm build
